apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo-1
data:
  config: |
    player_initial_lives="3"
    score="5000"
    name="John"
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo4
spec:
  containers:
    - name: demo
      image: rkalluru/learnk8s:rhel9-bare
      volumeMounts:
      - name: config
        mountPath: "/config"
        readOnly: true
  volumes:
  - name: config
    configMap:
      name: game-demo-1