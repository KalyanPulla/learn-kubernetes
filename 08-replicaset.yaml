apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myreplicaset
  labels:
    app: application
    key: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      key: debug
  template:
    metadata:
      labels:
        key: ram
    spec:
      containers:
        - name: myapp
          image: nginx
