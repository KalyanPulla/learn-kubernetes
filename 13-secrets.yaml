apiVersion: v1
kind: Secret
metadata:
  name: mysecret
data:
  username: cmFnaHU=
  password: YWJjZEAxMjM=
---
apiVersion: v1
kind: Pod
metadata:
  name: secret
spec:
  containers:
  - name: myapp
    image: nginx
    env:
    - name: username
      valueFrom:
        secretKeyRef:
          name: mysecret
          key: username