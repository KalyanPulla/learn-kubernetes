apiVersion: v1
kind: Pod
metadata:
  name: storage
spec:
  volumes:
    - name: sample
      emptyDir: {}
  containers:
  - name: myapp1
    image: nginx
    volumeMounts:
    - mountPath: /usr/share/nginx/html
      name: sample
  - name: myapp2
    image: redis
    volumeMounts:
    - mountPath: /opt/
      name: sample
